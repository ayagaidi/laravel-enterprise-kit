<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Laravel Enterprise Kit v0.1.0</title>
  <desc id="desc">Production-minded Laravel 13 foundation with RBAC, audit trails, system settings, Sanctum API, localization, tests and CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="95" r="220" fill="#f43f5e" opacity="0.07"/>
  <circle cx="1180" cy="580" r="260" fill="#6366f1" opacity="0.07"/>

  <g transform="translate(76 72)">
    <rect width="66" height="66" rx="17" fill="url(#accent)"/>
    <path d="M18 19h30v7H25v8h20v7H25v8h23v7H18z" fill="#fff"/>
    <text x="88" y="26" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2">OPEN SOURCE · v0.1.0</text>
    <text x="88" y="67" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800">Laravel Enterprise Kit</text>
  </g>

  <text x="76" y="210" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="26">A production-minded Laravel 13 foundation for serious business systems.</text>

  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18">
    <g transform="translate(76 255)"><rect width="146" height="44" rx="22" fill="#312e81"/><text x="73" y="28" text-anchor="middle" fill="#e0e7ff">Laravel 13</text></g>
    <g transform="translate(234 255)"><rect width="120" height="44" rx="22" fill="#3f1d2e"/><text x="60" y="28" text-anchor="middle" fill="#fecdd3">RBAC</text></g>
    <g transform="translate(366 255)"><rect width="150" height="44" rx="22" fill="#17352d"/><text x="75" y="28" text-anchor="middle" fill="#bbf7d0">Audit Trail</text></g>
    <g transform="translate(528 255)"><rect width="178" height="44" rx="22" fill="#20324b"/><text x="89" y="28" text-anchor="middle" fill="#bfdbfe">Sanctum API</text></g>
    <g transform="translate(718 255)"><rect width="170" height="44" rx="22" fill="#3b2d16"/><text x="85" y="28" text-anchor="middle" fill="#fde68a">AR / EN · RTL</text></g>
  </g>

  <g transform="translate(76 340)" filter="url(#shadow)">
    <rect width="1128" height="202" rx="24" fill="#0f172a" stroke="#334155"/>
    <g transform="translate(30 28)" font-family="Arial,Helvetica,sans-serif">
      <text x="0" y="22" fill="#94a3b8" font-size="15" font-weight="700">ENTERPRISE BASELINE</text>
      <g transform="translate(0 48)">
        <circle cx="10" cy="10" r="6" fill="#34d399"/><text x="28" y="16" fill="#e2e8f0" font-size="19">Least-privilege roles &amp; permissions</text>
        <circle cx="10" cy="48" r="6" fill="#34d399"/><text x="28" y="54" fill="#e2e8f0" font-size="19">Protected super-admin privilege boundaries</text>
        <circle cx="10" cy="86" r="6" fill="#34d399"/><text x="28" y="92" fill="#e2e8f0" font-size="19">Append-only audit events with secret redaction</text>
        <circle cx="10" cy="124" r="6" fill="#34d399"/><text x="28" y="130" fill="#e2e8f0" font-size="19">Versioned API + automated tests + Pint CI</text>
      </g>
      <g transform="translate(685 0)">
        <rect width="382" height="146" rx="18" fill="#111827" stroke="#334155"/>
        <text x="24" y="34" fill="#64748b" font-size="14">routes/api.php</text>
        <text x="24" y="68" fill="#c4b5fd" font-size="17" font-family="monospace">Route::prefix('v1')</text>
        <text x="24" y="96" fill="#93c5fd" font-size="17" font-family="monospace">-&gt;middleware('auth:sanctum')</text>
        <text x="24" y="124" fill="#86efac" font-size="17" font-family="monospace">-&gt;middleware('active');</text>
      </g>
    </g>
  </g>

  <text x="76" y="595" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="18">github.com/ayagaidi/laravel-enterprise-kit</text>
  <text x="1204" y="595" text-anchor="end" fill="#fda4af" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Built for extensibility. Designed for review.</text>
</svg>
